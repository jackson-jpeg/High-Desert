# High Desert — nginx vhost. Versioned copy of /etc/nginx/sites-available/highdesert
# (sites-enabled/highdesert is a symlink to it). `highdesert-status` WARNs when
# the installed file differs from this one; scripts/__tests__/nginx-vhost.test.ts
# asserts the properties below on this file. Apply steps: deploy/README.md.

upstream highdesert_app {
    server 127.0.0.1:3003;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Outer rate limit on the stats WRITE routes (HD-007)
#
# The app has its own per-client limits (src/lib/utils/rate-limit.ts, keyed on
# the IPv4 address or the IPv6 /64). This is the coarse layer in front of it:
# it sheds a flood in nginx, before a request body is read into Node, and it
# holds even if the app's limiter is restarted or its Map is saturated.
#
# Keyed on $binary_remote_addr, so IPv6 here is per *address*, not per /64 —
# nginx cannot mask a prefix in a key. That is fine for an outer limit: the /64
# bucketing that matters lives in the app.
#
# Only POSTs are limited: the key is empty for every other method, and nginx
# does not account requests with an empty key. GETs of the public stats are
# cheap, cached, and limited in the app.
#
# Budget: a normal tab writes about one request a minute (the 60s heartbeat)
# plus a play, a stop or a rating now and then. 60 r/m with a burst of 30 is
# far above any household and far below a script. The app's own limits are
# lower per route (heartbeat 20/min, playback-event 20/min, rate 30/min, play
# 60/min) — nginx is the ceiling across all of them, not a replacement.
# ---------------------------------------------------------------------------
map $request_method $hd_stats_write_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $hd_stats_write_key zone=hd_stats_write:10m rate=60r/m;

# /live-api/ (the phone lines: services/live, highdesert-live.service).
# POSTs — a call, a name, a report — get their own zone: the service allows
# one call per 3 s per caller itself, so 30 r/m with a burst of 10 is well
# above any person and well below a script. Streams are capped per address
# (a household with a few tabs, not a crawler holding hundreds open).
map $request_method $hd_live_write_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $hd_live_write_key zone=hd_live_write:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=hd_live_streams:10m;

# /mirror/ (the archive.org outage fallback) streams whole episodes; an audio
# element holds one or two connections. Six per address is a household, not
# a crawler walking the catalog through our disk.
limit_conn_zone $binary_remote_addr zone=hd_mirror:10m;

# ---------------------------------------------------------------------------
# HTTPS — the real vhost
# ---------------------------------------------------------------------------
server {
    # No http2 flag here deliberately. On nginx 1.24 it is a *listen socket*
    # option, so setting it would change the protocol for every other vhost
    # sharing :443 (chirpchirps, leftsaid, sang3r, ...) and nginx warns
    # "protocol options redefined". Not worth altering co-hosted sites.
    listen 187.77.218.14:443 ssl;
    listen [2a02:4780:4:1c0b::1]:443 ssl;
    server_name highdesert.space www.highdesert.space;

    ssl_certificate     /etc/letsencrypt/live/highdesert.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/highdesert.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Matches the max-age the site already sends from Vercel, so returning
    # visitors see no change in policy across the cutover.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # No /_next/static/ override: Next already sets
    # "public, max-age=31536000, immutable" on content-hashed assets, and adding
    # our own produced a duplicate Cache-Control header.

    # Proxy settings live at server level so every location below inherits the
    # same ones (nginx inherits proxy_set_header only into a location that sets
    # none of its own — so none of them may).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # OVERWRITE, never append: the in-memory rate limiter keys on this, so a
    # client-supplied X-Forwarded-For must not be able to spoof its identity.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 10M;

    # 429, not nginx's default 503: the client treats 503 as "stats down" and
    # 429 as "slow down", and this is the second.
    limit_req_status 429;

    # POST /api/stats/* — play, stop, rate, heartbeat (and sample, which the
    # timer sends to 127.0.0.1:3003 directly, not through here).
    location ^~ /api/stats/ {
        limit_req zone=hd_stats_write burst=30 nodelay;
        proxy_pass http://highdesert_app;
    }

    location = /api/playback-event {
        limit_req zone=hd_stats_write burst=30 nodelay;
        proxy_pass http://highdesert_app;
    }

    # The archive.org outage mirror (services/mirror, highdesert-mirror.service).
    # Same-origin range responses only; BitTorrent never reaches a browser.
    # Unbuffered, so the first bytes go out as the gateway gets them — the
    # client's failover is timing a first byte, not a whole file.
    location ^~ /mirror/ {
        limit_conn hd_mirror 6;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:3004;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    # Operational numbers are for highdesert-status, which asks 127.0.0.1:3004.
    location = /mirror/health {
        return 404;
    }

    # The phone lines (services/live). Paths are passed through unchanged —
    # the service serves /live-api/* itself. X-Forwarded-For is the
    # server-level overwrite above, which is the only address the service
    # trusts (and only because nginx is on loopback).
    location ^~ /live-api/ {
        limit_req zone=hd_live_write burst=10 nodelay;
        proxy_pass http://127.0.0.1:3005;
    }
    # The downstream: Server-Sent Events. Unbuffered, so a call reaches every
    # listener the moment it is posted; a long read timeout, because a quiet
    # stream is only a comment every 25 s.
    location = /live-api/stream {
        limit_conn hd_live_streams 8;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    # Operational numbers are for highdesert-status, which asks 127.0.0.1:3005.
    location = /live-api/health {
        return 404;
    }

    location / {
        proxy_pass http://highdesert_app;
    }
}

# ---------------------------------------------------------------------------
# HTTP — ACME first, then redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 187.77.218.14:80;
    listen [2a02:4780:4:1c0b::1]:80;
    server_name highdesert.space www.highdesert.space;

    # Must stay reachable over plain HTTP so renewals can switch to HTTP-01
    # once DNS points here (DNS-01 needed a manual TXT record and would not
    # renew unattended).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
