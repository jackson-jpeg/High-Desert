name: CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-24.04
    # A real Postgres, so the stats store is tested against the database it
    # runs on (query plans, statement_timeout, rollup windows) and so the
    # browser check below exercises the /api/stats routes instead of a wall
    # of 503s.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: highdesert_test
          POSTGRES_PASSWORD: highdesert_test
          POSTGRES_DB: highdesert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U highdesert_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://highdesert_test:highdesert_test@127.0.0.1:5432/highdesert_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The outage mirror is nginx configuration (services/mirror/lib/nginx.mjs);
      # services/mirror/test/nginx.test.mjs starts a real nginx from it and
      # fails in CI if there is none. The runner image ships nginx; this only
      # installs it if a future image does not.
      - name: nginx for the mirror's integration test
        run: command -v nginx >/dev/null || test -x /usr/sbin/nginx || sudo apt-get install -y --no-install-recommends nginx-core
      # services/live (the phone lines) is its own package (obscenity, pg).
      - name: Install live chat dependencies
        run: npm ci --prefix services/live --no-audit --no-fund
      - name: Apply schema
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/schema.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f services/live/schema.sql
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      # Does each test file actually observe the code it claims to test? Breaks
      # one real line per module and requires the suite to notice. Three defects
      # in this repo were passing tests disconnected from their subject, which
      # `npm run test` cannot distinguish from working ones.
      - name: Mutation check
        run: npm run test:mutations
      - name: Build
        run: npm run build
      # The CSP is enforced by the browser, so a policy that blocks something
      # the app needs passes every step above and ships a page that does
      # nothing. Load every route in Chromium and fail on any violation or
      # console error.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # One origin, the way nginx makes one in production: the app on :3001,
      # the phone lines (services/live) on :3005, and scripts/live-e2e-stack.mjs
      # on :3000 routing /live-api/* to the service. Without the service /live
      # asks Next for /live-api/* and logs its 404s — a composition production
      # never runs. Secrets are random per run; the admin token is exported so
      # e2e/live-chat.spec.ts hides what it posts.
      - name: Browser check (CSP and console errors)
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npm start -- -H 127.0.0.1 -p 3001 > next-start.log 2>&1 &
          admin="$(openssl rand -hex 32)"
          echo "::add-mask::$admin"
          echo "E2E_LIVE_ADMIN_TOKEN=$admin" >> "$GITHUB_ENV"
          LIVE_DATABASE_URL="$TEST_DATABASE_URL" CHAT_CLIENT_SECRET="$(openssl rand -hex 32)" LIVE_ADMIN_TOKEN="$admin" \
            LIVE_PORT=3005 LIVE_HOST=127.0.0.1 LIVE_ORIGINS=http://127.0.0.1:3000 \
            node services/live/server.mjs > live-start.log 2>&1 &
          node scripts/live-e2e-stack.mjs --port 3000 --app 3001 --live 3005 > stack.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && curl -sf -o /dev/null http://127.0.0.1:3000/live-api/me && break
            sleep 1
          done
          npm run check:csp -- http://127.0.0.1:3000 || { echo "--- next start log ---"; cat next-start.log; echo "--- live ---"; cat live-start.log; exit 1; }
      # The same running build, driven through real user flows: open /library,
      # let it seed, sort, scroll, and check what is on screen (e2e/). The
      # server started above is still up — background processes live until
      # the job ends — so this reuses it rather than starting a second one.
      - name: End-to-end (Playwright)
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          curl -sf -o /dev/null "$E2E_BASE_URL/library" || { echo "app not running"; cat next-start.log; exit 1; }
          npm run test:e2e || { echo "--- next start log ---"; cat next-start.log; echo "--- live ---"; cat live-start.log; exit 1; }
      - name: Upload e2e traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
