# Weekly npm updates. The critical Next.js advisory fixed on 2026-09-21
# (docs/security-exceptions.md) sat unnoticed because nothing watched for it.
#
# Dependabot opens PRs only. A merged update still reaches production only
# through `git pull && bash scripts/deploy.sh`, which installs changed
# dependencies in a staging copy (docs/deploy.md). Never `npm install` in
# /root/High-Desert itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "15:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      # Next and its lint config move together, or lint breaks.
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling-minor:
        dependency-type: development
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
