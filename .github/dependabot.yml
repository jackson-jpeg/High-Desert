# Weekly npm updates. The critical Next.js advisory fixed on 2026-09-21
# (docs/security-exceptions.md) sat unnoticed because nothing watched for it.
#
# Dependabot opens PRs only. A merged update still reaches production only
# through `git pull && bash scripts/deploy.sh`, which installs changed
# dependencies in a staging copy (docs/deploy.md). Never `npm install` in
# /root/High-Desert itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "15:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # One PR a week for every minor and patch update, so the lockfile is
    # rebased once and CI runs once (on 2026-09-28 four separate PRs meant four
    # rebases and four runs). A PR that changes the lockfile checks the whole
    # mutation list (scripts/mutate-check.mjs, RUN_ALL_WHEN_CHANGED).
    # Majors come separately, each its own PR, except the pairs below. A group
    # takes an update in the order written, so minor-and-patch comes first.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Next and its lint config move together, or lint breaks.
      next-major:
        patterns: ["next", "eslint-config-next", "@next/*"]
        update-types: ["major"]
      react-major:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies"]
